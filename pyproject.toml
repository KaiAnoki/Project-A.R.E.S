[project]
name = "project-ares"
version = "1.1.0"
description = "Local AI assistant with retrieval, tools, routing, and SQLite memory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Khyri Williams (Kai)"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
